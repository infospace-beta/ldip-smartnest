name: Release checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-key-never-use-in-production-0000000000000000000000000000
      DB_NAME: postgres
      DB_USER: postgres
      DB_PASSWORD: ci-only-password
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_SCHEMA: public
      SUPABASE_AUTH_ENABLED: 'false'
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-public-placeholder
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python deploy/check-source.py
      - run: python -m pip install -r backend/requirements.txt
      - run: python backend/manage.py makemigrations --check --dry-run
      - run: python backend/manage.py test core --noinput
      - run: npm ci
        working-directory: frontend
      - run: node --test tests/*.test.cjs
        working-directory: frontend
      - run: npm run lint -- --max-warnings=0
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend
